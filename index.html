    animation: slowzoom 14s ease-in-out infinite alternate;
    transition: filter .5s ease;
  }
  @keyframes slowzoom { from { transform: scale(1) translate(0,0); } to { transform: scale(1.07) translate(-1%, 1%); } }
  .photo.yes { filter: saturate(1.8) hue-rotate(-25deg) contrast(1.1); }
  .photo.no  { filter: grayscale(1) contrast(1.15) brightness(.85); }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(10,6,25,.55) 0%, rgba(10,6,25,0) 28%, rgba(10,6,25,0) 55%, rgba(10,6,25,.8) 100%),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%);
  }

  .bubble {
    position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px);
    transform: translateX(-50%); width: min(92%, 520px);
    background: var(--paper); border: 4px solid var(--ink); border-radius: 28px;
    padding: 16px 20px; text-align: center;
    font-size: clamp(22px, 6vw, 34px); font-weight: 700; line-height: 1.2;
    box-shadow: 6px 6px 0 var(--ink);
    z-index: 5;
  }
  .bubble::before, .bubble::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); }
  .bubble::before { bottom: -26px; border: 14px solid transparent; border-top: 22px solid var(--ink); border-bottom: 0; }
  .bubble::after { bottom: -17px; border: 10px solid transparent; border-top: 17px solid var(--paper); border-bottom: 0; }
  .bubble.pop { animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: translateX(-50%) scale(.5) rotate(-4deg); } 100% { transform: translateX(-50%) scale(1) rotate(0); } }

  .actions {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    display: flex; justify-content: center; gap: 18px; padding: 0 20px; z-index: 5;
  }
  button {
    font-family: inherit; font-size: 24px; font-weight: 700; color: var(--ink);
    border: 4px solid var(--ink); border-radius: 18px; padding: 12px 34px; cursor: pointer; outline: none;
    box-shadow: 5px 5px 0 var(--ink); transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translate(-2px, -3px) rotate(-2deg); box-shadow: 8px 9px 0 var(--ink); }
  button:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #yes { background: var(--mint); }
  #no { background: var(--pink); }
  #again { display: none; background: var(--yellow); font-size: 20px; }

  .shake { animation: shake .55s; }
  @keyframes shake {
    0%,100% { transform: translate(0); } 15% { transform: translate(-14px, 4px); } 30% { transform: translate(12px, -5px); }
    45% { transform: translate(-9px, 3px); } 60% { transform: translate(8px, -3px); } 80% { transform: translate(-4px, 1px); }
  }
  .rain { position: fixed; top: -60px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(calc(100vh + 120px)) rotate(var(--r)); } }
  @media (prefers-reduced-motion: reduce) { .photo { animation: none; } }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="photo" id="photo"></div>
    <div class="vignette"></div>
    <div class="bubble" id="bubble">Guti ki bhalo hobe? 🎲</div>
    <div class="actions" id="actions">
      <button id="yes">Yes 😎</button>
      <button id="no">No 😬</button>
      <button id="again">Abar jiggesh koro 🔄</button>
    </div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const photo = document.getElementById('photo');
  const bubble = document.getElementById('bubble');
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const again = document.getElementById('again');

  function rainOf(list, count) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const e = document.createElement('div');
        e.className = 'rain';
        e.textContent = list[Math.floor(Math.random() * list.length)];
        e.style.left = Math.random() * 95 + 'vw';
        e.style.fontSize = (24 + Math.random() * 34) + 'px';
        e.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
        e.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(e);
        setTimeout(() => e.remove(), 4200);
      }, i * 45);
    }
  }

  function react(mode, msg, list) {
    yes.style.display = 'none'; no.style.display = 'none'; again.style.display = 'inline-block';
    photo.classList.remove('yes', 'no'); photo.classList.add(mode);
    bubble.textContent = msg;
    bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    rainOf(list, 45);
  }

  yes.addEventListener('click', () => react('yes', 'Unpossible! 🤡', ['🤡', '💀', '🫠', '😂', '🙃']));
  no.addEventListener('click', () => react('no', 'Eta kutta o jane, guti bhalo hobe na! 🐕', ['🐕', '🐶', '🦴', '😂', '🤣']));

  again.addEventListener('click', () => {
    yes.style.display = ''; no.style.display = ''; again.style.display = 'none';
    photo.classList.remove('yes', 'no');
    bubble.textContent = 'Guti ki bhalo hobe? 🎲';
  });
</script>
</body>
</html>
